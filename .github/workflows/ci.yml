name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check -
          tar -xzf actionlint.tar.gz actionlint

      - name: Lint GitHub Actions workflows
        run: ./actionlint -color

  docs-quality:
    name: Documentation Quality
    needs: workflow-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint Markdown
        run: npm run lint:docs

      - name: Check documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --max-retries 3 README.md CONTRIBUTING.md docs/RELEASING.md
          fail: true
          failIfEmpty: true
          jobSummary: true
          token: ${{ github.token }}

  commit-governance:
    name: Commit Governance
    needs: workflow-lint
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install governance dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate pull request commit range
        if: github.event_name == 'pull_request'
        run: >-
          npm exec --no -- commitlint
          --config commitlint.config.cjs
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
          --verbose

      - name: Validate push commit range
        if: github.event_name == 'push'
        run: >-
          npm exec --no -- commitlint
          --config commitlint.config.cjs
          --from "${{ github.event.before }}"
          --to "${{ github.sha }}"
          --verbose

  validate:
    name: Validate
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release configuration
        run: npm test

      - name: Build TypeScript
        run: npm run build

  appimage-contract:
    name: AppImage Package Contract
    needs:
      - commit-governance
      - docs-quality
      - validate
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      APPIMAGEHUB_REF: 12f791deb941ff5c7a1b35007249e4e2c0e22d2b
      APPDIR_LINT_REF: 19e30b276ffedf4d3b4b56bc6320f463625a74f8

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install AppImage validation tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            appstream desktop-file-utils libfile-mimeinfo-perl squashfs-tools

      - name: Install dependencies
        run: npm ci

      - name: Validate AppStream metadata
        run: appstreamcli validate --pedantic build/linux/com.rjmejia.humancrop.appdata.xml

      - name: Build production AppImage
        run: |
          npm run validate:models
          npm run build
          npm exec -- electron-builder --linux AppImage --publish never

      - name: Fetch pinned AppImage upstream checks
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_DIR="${RUNNER_TEMP}/appimage-upstream"
          mkdir -p "${UPSTREAM_DIR}"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/AppImage/appimage.github.io/${APPIMAGEHUB_REF}/code/check-name.sh" \
            --output "${UPSTREAM_DIR}/check-name.sh"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/AppImageCommunity/pkg2appimage/${APPDIR_LINT_REF}/appdir-lint.sh" \
            --output "${UPSTREAM_DIR}/appdir-lint.sh"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/AppImageCommunity/pkg2appimage/${APPDIR_LINT_REF}/excludelist" \
            --output "${UPSTREAM_DIR}/excludelist"

      - name: Validate AppImage package contract
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          EXPECTED="HumanCrop-${VERSION}-x86_64.AppImage"
          mapfile -t APPIMAGES < <(find release -maxdepth 1 -type f -name '*.AppImage' -printf '%f\n' | sort)
          if [[ ${#APPIMAGES[@]} -ne 1 ]]; then
            printf 'Expected exactly one AppImage, found %s\n' "${#APPIMAGES[@]}" >&2
            printf '%s\n' "${APPIMAGES[@]}" >&2
            exit 1
          fi
          if [[ "${APPIMAGES[0]}" != "${EXPECTED}" ]]; then
            printf 'Unexpected AppImage name: %s (expected %s)\n' "${APPIMAGES[0]}" "${EXPECTED}" >&2
            exit 1
          fi

          APPIMAGE="release/${EXPECTED}"
          UPSTREAM_DIR="${RUNNER_TEMP}/appimage-upstream"
          NAME_OUTPUT="$(bash "${UPSTREAM_DIR}/check-name.sh" --appimage "${EXPECTED}")"
          if [[ -n "${NAME_OUTPUT}" ]]; then
            printf '%s\n' "${NAME_OUTPUT}" >&2
            exit 1
          fi

          OFFSET="$("${APPIMAGE}" --appimage-offset 2>/dev/null | tail -n 1)"
          if [[ ! "${OFFSET}" =~ ^[0-9]+$ ]]; then
            printf 'Could not determine AppImage SquashFS offset\n' >&2
            exit 1
          fi

          SQUASHFS_INFO="$(unsquashfs -s -o "${OFFSET}" "${APPIMAGE}")"
          printf '%s\n' "${SQUASHFS_INFO}"
          if ! grep -Eq '^Compression (gzip|zstd)$' <<< "${SQUASHFS_INFO}"; then
            printf 'Unsupported SquashFS compression for AppImageHub\n' >&2
            exit 1
          fi

          rm -rf squashfs-root
          "${APPIMAGE}" --appimage-extract >/dev/null
          APPSTREAM_FILE="squashfs-root/usr/share/metainfo/com.rjmejia.humancrop.appdata.xml"
          test -f "${APPSTREAM_FILE}"
          appstreamcli validate-tree --pedantic squashfs-root
          bash "${UPSTREAM_DIR}/appdir-lint.sh" squashfs-root

          sha256sum "${APPIMAGE}"

  deb-package-contract:
    name: DEB Package Contract
    needs:
      - commit-governance
      - docs-quality
      - validate
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Debian packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Build production DEB
        run: |
          npm run validate:models
          npm run build
          npm exec -- electron-builder --linux deb --publish never

      - name: Validate DEB package contract
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          DEB="release/HumanCrop-${VERSION}-linux-amd64.deb"
          test -f "${DEB}"

          PACKAGE_NAME="$(dpkg-deb --field "${DEB}" Package)"
          PACKAGE_VERSION="$(dpkg-deb --field "${DEB}" Version)"
          PACKAGE_ARCH="$(dpkg-deb --field "${DEB}" Architecture)"
          [[ "${PACKAGE_NAME}" == "humancrop" ]]
          [[ "${PACKAGE_VERSION}" == "${VERSION}" ]]
          [[ "${PACKAGE_ARCH}" == "amd64" ]]

          CONTENTS="$(dpkg-deb --contents "${DEB}")"
          grep -Eq '/usr/share/applications/humancrop\.desktop$' <<< "${CONTENTS}"
          if grep -Eq '/opt/.*/usr/share/metainfo/com\.rjmejia\.humancrop\.appdata\.xml$' <<< "${CONTENTS}"; then
            echo 'AppImage-only AppStream metadata leaked into the DEB application prefix.' >&2
            exit 1
          fi

          sha256sum "${DEB}"

  windows-package-contract:
    name: Windows Package Contract
    needs:
      - commit-governance
      - docs-quality
      - validate
    runs-on: windows-2025
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production Windows installer
        run: |
          npm run validate:models
          npm run build
          npm exec -- electron-builder --win nsis --publish never

      - name: Validate Windows package contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = node -p "require('./package.json').version"
          $exe = Join-Path "release" "HumanCrop-$version-win-x64.exe"
          $blockmap = "$exe.blockmap"

          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Missing expected Windows installer: $exe"
          }
          if (-not (Test-Path -LiteralPath $blockmap)) {
            throw "Missing expected Windows blockmap: $blockmap"
          }

          $stream = [IO.File]::OpenRead($exe)
          try {
            $first = $stream.ReadByte()
            $second = $stream.ReadByte()
          } finally {
            $stream.Dispose()
          }
          if ($first -ne 0x4D -or $second -ne 0x5A) {
            throw "Windows installer does not have an MZ PE header."
          }
          if ((Get-Item -LiteralPath $exe).Length -lt 1MB) {
            throw "Windows installer is unexpectedly small."
          }

          Get-FileHash -Algorithm SHA256 -LiteralPath $exe
          Get-FileHash -Algorithm SHA256 -LiteralPath $blockmap

  dependency-review:
    name: Dependency Review
    needs: workflow-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          vulnerability-check: true
          license-check: false
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 60

      - name: Confirm dependency review is pull-request scoped
        if: github.event_name == 'push'
        run: echo "Dependency Review applies to pull requests; this push follows a protected-branch merge."

  required-ci:
    name: Required CI
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - workflow-lint
      - commit-governance
      - docs-quality
      - validate
      - appimage-contract
      - deb-package-contract
      - windows-package-contract
      - dependency-review

    steps:
      - name: Require all governed CI contracts
        env:
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
          COMMIT_GOVERNANCE_RESULT: ${{ needs.commit-governance.result }}
          DOCS_QUALITY_RESULT: ${{ needs.docs-quality.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          APPIMAGE_CONTRACT_RESULT: ${{ needs.appimage-contract.result }}
          DEB_CONTRACT_RESULT: ${{ needs.deb-package-contract.result }}
          WINDOWS_CONTRACT_RESULT: ${{ needs.windows-package-contract.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_LINT_RESULT" = "success"
          test "$COMMIT_GOVERNANCE_RESULT" = "success"
          test "$DOCS_QUALITY_RESULT" = "success"
          test "$VALIDATE_RESULT" = "success"
          test "$APPIMAGE_CONTRACT_RESULT" = "success"
          test "$DEB_CONTRACT_RESULT" = "success"
          test "$WINDOWS_CONTRACT_RESULT" = "success"
          test "$DEPENDENCY_REVIEW_RESULT" = "success"

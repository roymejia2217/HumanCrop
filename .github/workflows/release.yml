name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  HUSKY: 0
  APPIMAGEHUB_REF: 12f791deb941ff5c7a1b35007249e4e2c0e22d2b
  APPDIR_LINT_REF: 19e30b276ffedf4d3b4b56bc6320f463625a74f8

jobs:
  release-identity:
    name: Release Identity Gate
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.identity.outputs.configured }}

    steps:
      - name: Check dedicated release identity
        id: identity
        shell: bash
        env:
          CLIENT_ID: ${{ vars.HUMANCROP_RELEASE_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.HUMANCROP_RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "$CLIENT_ID" && -n "$PRIVATE_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Dedicated HumanCrop release GitHub App is not configured; release orchestration remains dormant."

  release-detection:
    name: Detect Pending Release
    needs: release-identity
    if: ${{ needs.release-identity.outputs.configured == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      pending_release: ${{ steps.detect.outputs.pending_release }}
      version: ${{ steps.detect.outputs.version }}
      sha: ${{ steps.detect.outputs.sha }}

    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect governed pending release
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git rev-parse HEAD)"
          VERSION="$(jq -r '.version' package.json)"
          LOCK_VERSION="$(jq -r '.version' package-lock.json)"
          MANIFEST_VERSION="$(jq -r '."."' .release-please-manifest.json)"

          if [[ "$VERSION" != "$LOCK_VERSION" ]] || [[ "$VERSION" != "$MANIFEST_VERSION" ]]; then
            echo "Version files disagree: package=$VERSION lock=$LOCK_VERSION manifest=$MANIFEST_VERSION" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::notice::v$VERSION already exists; no release is pending."
            echo "sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
            echo "pending_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          EXPECTED_SUBJECT="chore(main): release $VERSION"
          RELEASE_SHA="$(git log --format='%H%x09%s' | awk -F '\t' -v expected="$EXPECTED_SUBJECT" '$2 == expected && !found {print $1; found=1}')"
          if [[ -z "$RELEASE_SHA" ]]; then
            echo "Version $VERSION has no tag and no governed release commit." >&2
            exit 1
          fi

          git merge-base --is-ancestor "$RELEASE_SHA" "$CURRENT_SHA"

          RELEASE_PACKAGE_VERSION="$(git show "${RELEASE_SHA}:package.json" | jq -r '.version')"
          RELEASE_LOCK_VERSION="$(git show "${RELEASE_SHA}:package-lock.json" | jq -r '.version')"
          RELEASE_MANIFEST_VERSION="$(git show "${RELEASE_SHA}:.release-please-manifest.json" | jq -r '."."')"
          if [[ "$RELEASE_PACKAGE_VERSION" != "$VERSION" || "$RELEASE_LOCK_VERSION" != "$VERSION" || "$RELEASE_MANIFEST_VERSION" != "$VERSION" ]]; then
            echo "Release commit version state does not match $VERSION." >&2
            exit 1
          fi

          SUCCESSFUL_CI_RUNS="$(gh api --method GET "repos/${REPOSITORY}/actions/runs" \
            -f head_sha="$RELEASE_SHA" \
            -f event=push \
            -f status=completed \
            -f per_page=100 \
            --jq '[.workflow_runs[] | select(.name == "CI" and .head_branch == "main" and .conclusion == "success")] | length')"
          if [[ "$SUCCESSFUL_CI_RUNS" -lt 1 ]]; then
            echo "Release commit $RELEASE_SHA has no successful main CI push run." >&2
            exit 1
          fi

          echo "::notice::Pending governed release v$VERSION at $RELEASE_SHA."
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "pending_release=true" >> "$GITHUB_OUTPUT"

  release-pr:
    name: Maintain Release Please PR
    needs: release-detection
    if: ${{ needs.release-detection.outputs.pending_release != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Create scoped release GitHub App token
        id: release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HUMANCROP_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.HUMANCROP_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Create or update draft release pull request
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.release-app-token.outputs.token }}
          skip-github-release: true

  build-windows:
    name: Build Verified Windows Candidate
    needs: release-detection
    if: ${{ needs.release-detection.outputs.pending_release == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false

      - name: Checkout released revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-detection.outputs.sha }}
          lfs: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release configuration
        run: npm test

      - name: Build Windows installer
        run: |
          npm run validate:models
          npm run build
          npm exec -- electron-builder --win nsis --publish never

      - name: Verify Windows candidate and record SHA-256
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release-detection.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path "release" "HumanCrop-$env:RELEASE_VERSION-win-x64.exe"
          $blockmap = "$exe.blockmap"

          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Missing expected Windows installer: $exe"
          }
          if (-not (Test-Path -LiteralPath $blockmap)) {
            throw "Missing expected Windows blockmap: $blockmap"
          }

          $exeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          $blockmapHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $blockmap).Hash.ToLowerInvariant()
          @(
            "$exeHash  $([IO.Path]::GetFileName($exe))"
            "$blockmapHash  $([IO.Path]::GetFileName($blockmap))"
          ) | Set-Content -LiteralPath "release/SHA256SUMS-windows.txt" -Encoding ascii

      - name: Upload verified Windows candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-candidate
          path: |
            release/HumanCrop-${{ needs.release-detection.outputs.version }}-win-x64.exe
            release/HumanCrop-${{ needs.release-detection.outputs.version }}-win-x64.exe.blockmap
            release/SHA256SUMS-windows.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-linux:
    name: Build Verified Linux Candidates
    needs: release-detection
    if: ${{ needs.release-detection.outputs.pending_release == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout released revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-detection.outputs.sha }}
          lfs: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging and AppImage validation tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            appstream desktop-file-utils libarchive-tools \
            libfile-mimeinfo-perl squashfs-tools

      - name: Install dependencies
        run: npm ci

      - name: Validate release configuration
        run: npm test

      - name: Validate AppStream metadata
        run: appstreamcli validate --pedantic build/linux/com.rjmejia.humancrop.appdata.xml

      - name: Build Linux packages
        run: npm run dist:linux

      - name: Fetch pinned AppImage upstream checks
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_DIR="${RUNNER_TEMP}/appimage-upstream"
          mkdir -p "$UPSTREAM_DIR"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/AppImage/appimage.github.io/${APPIMAGEHUB_REF}/code/check-name.sh" \
            --output "$UPSTREAM_DIR/check-name.sh"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/AppImageCommunity/pkg2appimage/${APPDIR_LINT_REF}/appdir-lint.sh" \
            --output "$UPSTREAM_DIR/appdir-lint.sh"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/AppImageCommunity/pkg2appimage/${APPDIR_LINT_REF}/excludelist" \
            --output "$UPSTREAM_DIR/excludelist"

      - name: Verify Linux candidates and record SHA-256
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-detection.outputs.version }}
        run: |
          set -euo pipefail
          APPIMAGE="release/HumanCrop-${RELEASE_VERSION}-x86_64.AppImage"
          DEB="release/HumanCrop-${RELEASE_VERSION}-linux-amd64.deb"
          test -f "$APPIMAGE"
          test -f "$DEB"

          UPSTREAM_DIR="${RUNNER_TEMP}/appimage-upstream"
          NAME_OUTPUT="$(bash "$UPSTREAM_DIR/check-name.sh" --appimage "$(basename "$APPIMAGE")")"
          if [[ -n "$NAME_OUTPUT" ]]; then
            printf '%s\n' "$NAME_OUTPUT" >&2
            exit 1
          fi

          OFFSET="$("$APPIMAGE" --appimage-offset 2>/dev/null | tail -n 1)"
          if [[ ! "$OFFSET" =~ ^[0-9]+$ ]]; then
            echo "Could not determine AppImage SquashFS offset" >&2
            exit 1
          fi

          SQUASHFS_INFO="$(unsquashfs -s -o "$OFFSET" "$APPIMAGE")"
          printf '%s\n' "$SQUASHFS_INFO"
          if ! grep -Eq '^Compression (gzip|zstd)$' <<< "$SQUASHFS_INFO"; then
            echo "Unsupported SquashFS compression for AppImageHub" >&2
            exit 1
          fi

          rm -rf squashfs-root
          "$APPIMAGE" --appimage-extract >/dev/null
          APPSTREAM_FILE="squashfs-root/usr/share/metainfo/com.rjmejia.humancrop.appdata.xml"
          test -f "$APPSTREAM_FILE"
          appstreamcli validate-tree --pedantic squashfs-root
          bash "$UPSTREAM_DIR/appdir-lint.sh" squashfs-root

          sha256sum "$APPIMAGE" "$DEB" |
            sed 's#  release/#  #' > release/SHA256SUMS-linux.txt

      - name: Upload verified Linux candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-candidate
          path: |
            release/HumanCrop-${{ needs.release-detection.outputs.version }}-x86_64.AppImage
            release/HumanCrop-${{ needs.release-detection.outputs.version }}-linux-amd64.deb
            release/SHA256SUMS-linux.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  create-draft-release:
    name: Create Verified Draft Release
    needs:
      - release-detection
      - build-windows
      - build-linux
    if: ${{ needs.release-detection.outputs.pending_release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Create scoped release GitHub App token
        id: release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HUMANCROP_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.HUMANCROP_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Create Release Please tag and draft release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.release-app-token.outputs.token }}
          skip-github-pull-request: true

      - name: Verify Release Please outputs
        shell: bash
        env:
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          EXPECTED_VERSION: ${{ needs.release-detection.outputs.version }}
          EXPECTED_SHA: ${{ needs.release-detection.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_CREATED" == "true" ]]
          [[ "$RELEASE_VERSION" == "$EXPECTED_VERSION" ]]
          [[ "$RELEASE_TAG" == "v$EXPECTED_VERSION" ]]
          [[ "$RELEASE_SHA" == "$EXPECTED_SHA" ]]

  publish:
    name: Publish Verified Release
    needs:
      - create-draft-release
      - build-windows
      - build-linux
    if: ${{ needs.create-draft-release.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Download verified Windows candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release-candidate
          path: candidate/windows

      - name: Download verified Linux candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-release-candidate
          path: candidate/linux

      - name: Create publication GitHub App token
        id: publish-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HUMANCROP_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.HUMANCROP_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Verify candidate identity and draft release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.publish-app-token.outputs.token }}
          RELEASE_VERSION: ${{ needs.create-draft-release.outputs.version }}
          RELEASE_TAG: ${{ needs.create-draft-release.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.create-draft-release.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == "v$RELEASE_VERSION" ]]

          WINDOWS_EXE="candidate/windows/HumanCrop-${RELEASE_VERSION}-win-x64.exe"
          WINDOWS_BLOCKMAP="${WINDOWS_EXE}.blockmap"
          APPIMAGE="candidate/linux/HumanCrop-${RELEASE_VERSION}-x86_64.AppImage"
          DEB="candidate/linux/HumanCrop-${RELEASE_VERSION}-linux-amd64.deb"
          test -f "$WINDOWS_EXE"
          test -f "$WINDOWS_BLOCKMAP"
          test -f "$APPIMAGE"
          test -f "$DEB"

          (cd candidate/windows && sha256sum --check SHA256SUMS-windows.txt)
          (cd candidate/linux && sha256sum --check SHA256SUMS-linux.txt)

          ACTUAL_SHA="$(gh api "repos/${REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')"
          if [[ "$ACTUAL_SHA" != "$RELEASE_SHA" ]]; then
            echo "Release tag points to $ACTUAL_SHA, expected $RELEASE_SHA" >&2
            exit 1
          fi

          IS_DRAFT="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json isDraft --jq '.isDraft')"
          [[ "$IS_DRAFT" == "true" ]]

          ASSET_COUNT="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json assets --jq '.assets | length')"
          if [[ "$ASSET_COUNT" != "0" ]]; then
            echo "Draft release already contains assets; refusing to overwrite immutable candidates." >&2
            exit 1
          fi

          cat             candidate/windows/SHA256SUMS-windows.txt             candidate/linux/SHA256SUMS-linux.txt |
            sort > candidate/SHA256SUMS.txt

      - name: Upload immutable assets to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.publish-app-token.outputs.token }}
          RELEASE_VERSION: ${{ needs.create-draft-release.outputs.version }}
          RELEASE_TAG: ${{ needs.create-draft-release.outputs.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG"             "candidate/windows/HumanCrop-${RELEASE_VERSION}-win-x64.exe"             "candidate/windows/HumanCrop-${RELEASE_VERSION}-win-x64.exe.blockmap"             "candidate/linux/HumanCrop-${RELEASE_VERSION}-x86_64.AppImage"             "candidate/linux/HumanCrop-${RELEASE_VERSION}-linux-amd64.deb"             "candidate/SHA256SUMS.txt"             --repo "$REPOSITORY"

      - name: Verify uploaded asset digests
        shell: bash
        env:
          GH_TOKEN: ${{ steps.publish-app-token.outputs.token }}
          RELEASE_VERSION: ${{ needs.create-draft-release.outputs.version }}
          RELEASE_TAG: ${{ needs.create-draft-release.outputs.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh api "repos/${REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          ACTUAL_COUNT="$(jq '.assets | length' <<< "$RELEASE_JSON")"
          [[ "$ACTUAL_COUNT" == "5" ]]

          FILES=(
            "candidate/windows/HumanCrop-${RELEASE_VERSION}-win-x64.exe"
            "candidate/windows/HumanCrop-${RELEASE_VERSION}-win-x64.exe.blockmap"
            "candidate/linux/HumanCrop-${RELEASE_VERSION}-x86_64.AppImage"
            "candidate/linux/HumanCrop-${RELEASE_VERSION}-linux-amd64.deb"
            "candidate/SHA256SUMS.txt"
          )

          for FILE in "${FILES[@]}"; do
            NAME="$(basename "$FILE")"
            LOCAL_HASH="$(sha256sum "$FILE" | awk '{print $1}')"
            REMOTE_DIGEST="$(jq -r --arg name "$NAME" '.assets[] | select(.name == $name) | .digest' <<< "$RELEASE_JSON")"
            if [[ "$REMOTE_DIGEST" != "sha256:$LOCAL_HASH" ]]; then
              echo "Digest mismatch for $NAME: $REMOTE_DIGEST != sha256:$LOCAL_HASH" >&2
              exit 1
            fi
          done

      - name: Publish verified draft release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.publish-app-token.outputs.token }}
          RELEASE_TAG: ${{ needs.create-draft-release.outputs.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --draft=false --latest
          FINAL_DRAFT="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json isDraft --jq '.isDraft')"
          [[ "$FINAL_DRAFT" == "false" ]]
